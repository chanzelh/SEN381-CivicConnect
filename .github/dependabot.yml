version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/CivicConnectCode/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
 
  - package-ecosystem: "npm"
    directory: "/CivicConnectCode/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
 
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
 